name: Aquecer cache de estoque

# Mantem a tabela pcp_estoque_cache (Supabase) sempre quente, chamando o
# endpoint estoque-lote em segundo plano, em vez de deixar esse trabalho
# acontecer ao vivo quando alguem abre o dashboard (o que travava as telas
# de Sell-through, Sugestao PCP e Curva ABC por varios minutos com o cache
# frio, ja que a DAPIC limita a 60 requisicoes/min para a empresa toda).
#
# Cada chamada ao estoque-lote ja respeita esse limite internamente (pausa
# de ~1.1s entre produtos nao cacheados) e processa o que couber em ~20s;
# por isso este job repete a chamada, seguindo a paginacao (proximoOffset),
# ate passar por todo o catalogo (~550 produtos ativos) ou ate o limite de
# rodadas abaixo.
#
# SCHEDULE REMOVIDO em 24/09/2026: o agendamento a cada 15 min do GitHub
# Actions nao estava disparando de forma confiavel (so a cada ~5h na
# pratica - o GitHub despriorizada cron de alta frequencia em repos com
# pouca atividade), deixando o cache esfriar e travando o dashboard. O
# aquecimento agora roda direto no Postgres do Supabase via pg_cron/pg_net
# (7 jobs "aquecer-cache-estoque-N", 1x por hora, escalonados nos primeiros
# 12 min de cada hora - ver SQL em warm_cache_pgcron.sql), que roda dentro
# da infra do proprio Supabase e nao depende do agendador do GitHub. Este
# workflow fica so como acionamento manual, se precisar aquecer na mao.

on:
  workflow_dispatch: {}

jobs:
  warm:
    runs-on: ubuntu-latest
    steps:
      - name: Percorrer o catalogo aquecendo o cache
        run: |
          BASE="https://lrtphrdqyeoblbwwnujv.supabase.co/functions/v1/pcp-dapic"
          KEY="sb_publishable_3uUw6iqFiXqBwnU5Kj5k7Q_PEMLUHEe"
          OFFSET=0
          RODADA=1
          MAX_RODADAS=60

          while [ "$RODADA" -le "$MAX_RODADAS" ]; do
            RESP=$(curl -sS -G "$BASE" \
              -H "Authorization: Bearer $KEY" \
              -H "apikey: $KEY" \
              --data-urlencode "endpoint=estoque-lote" \
              --data-urlencode "offset=$OFFSET" \
              --data-urlencode "limite=100")

            PROCESSADOS=$(echo "$RESP" | jq -r '.produtos | length')
            TOTAL=$(echo "$RESP" | jq -r '.totalProdutos')
            NEXT=$(echo "$RESP" | jq -r '.proximoOffset // empty')
            echo "rodada $RODADA offset=$OFFSET processados=$PROCESSADOS total=$TOTAL proximoOffset=$NEXT"

            if [ -z "$NEXT" ]; then
              echo "Cache totalmente quente — catalogo inteiro percorrido nesta rodada."
              break
            fi

            OFFSET="$NEXT"
            RODADA=$((RODADA + 1))
          done
